<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block admin_page_title %}Painel administrativo{% endblock %} — {{ site_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__brand">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="10" cy="10" r="4" fill="currentColor"/>
                    <circle cx="30" cy="9" r="3.2" fill="currentColor"/>
                    <circle cx="8" cy="30" r="3.2" fill="currentColor"/>
                    <circle cx="27" cy="29" r="4.4" fill="currentColor"/>
                    <circle cx="20" cy="19" r="3" fill="currentColor"/>
                    <path d="M10 10L20 19M30 9L20 19M8 30L20 19M27 29L20 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <span>Rede Solidária</span>
            </div>
            <nav class="admin-nav">
                <a href="/admin" class="{% if active == 'dashboard' %}is-active{% endif %}">Dashboard</a>
                <a href="/admin/instituicoes" class="{% if active == 'instituicoes' %}is-active{% endif %}">Instituições</a>
                <a href="/admin/sugestoes" class="{% if active == 'sugestoes' %}is-active{% endif %}">Sugestões</a>
                <a href="/admin/solicitacoes" class="{% if active == 'solicitacoes' %}is-active{% endif %}">Solicitações de ajuda</a>
                <a href="/admin/feedbacks" class="{% if active == 'feedbacks' %}is-active{% endif %}">Feedbacks</a>
                <a href="/admin/configuracoes" class="{% if active == 'configuracoes' %}is-active{% endif %}">Configurações</a>
            </nav>
            <div class="admin-sidebar__footer">
                <a href="/" target="_blank" rel="noopener">Ver site público ↗</a>
                <form method="post" action="/admin/logout">
                    <button type="submit">Sair da conta</button>
                </form>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <h1>{% block admin_title %}{% endblock %}</h1>
                <span class="admin-topbar__user">Olá, {{ admin.username }}</span>
            </header>
            <div class="admin-content">
                {% block admin_content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
